}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 14px 110px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto}
h1{margin:2px 0 2px;font-size:1.75rem;letter-spacing:-.01em;line-height:1.15}
h3{margin:0 0 8px;font-size:1.05rem}
.sub{color:var(--mute);margin:0 0 12px;font-size:.95rem}
.hint{color:var(--mute);font-weight:400;font-size:.88rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:76px;resize:vertical;display:block}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;flex:none;accent-color:var(--home)}
:focus-visible{outline:3px solid var(--self);outline-offset:2px}
.panel{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.panel.alert{border-left:5px solid var(--warn)}
.panel.note{border-left:5px solid var(--home)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.85rem}
.stat.bad b{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:var(--ink);color:var(--bg);padding:10px 14px;min-height:44px;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.done{background:var(--c,var(--home));color:var(--on)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.85rem}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0 10px 12px;border-left:5px solid var(--c);margin-top:8px;background:var(--bg);border-radius:0 10px 10px 0;padding-right:8px}
.row .t{font-weight:600}
.row small{display:block;color:var(--mute);font-size:.85rem}
.over{color:var(--warn);font-weight:600}
.heads{color:var(--ink)!important}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.r1{display:flex;gap:6px;align-items:center}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.r2 label.wide{grid-column:1/-1}
.r2 label,label.t{display:block;font-size:.8rem;color:var(--mute)}
label.t{margin:12px 0 4px}
.r2 input,.r2 select{margin-top:2px}
.inl{display:flex;gap:6px;margin-top:2px}
.inl input{width:68px;flex:none;margin:0}
.inl select{margin:0;flex:1;min-width:0}
.r3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.due{font-size:.88rem;color:var(--mute)}
.x{flex:none;border:0;background:none;color:var(--mute);font-size:1.5rem;line-height:1;width:44px;height:44px;cursor:pointer;border-radius:10px}
.add{display:flex;gap:8px;margin-top:10px}
.add button{flex:none;border:0;border-radius:10px;background:var(--c,var(--ink));color:var(--on);padding:0 16px;min-height:44px;font-weight:600}
.add select{width:auto;flex:none;max-width:42%}
details.card{background:var(--card);border-radius:14px;margin-bottom:12px;border-left:6px solid var(--c)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;min-height:52px;font-weight:700;font-size:1.1rem}
details.card>summary::-webkit-details-marker,details.more>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);flex:none;margin:-4px 4px 0 0}
details.card[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.chip{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--mute);background:var(--bg);border-radius:999px;padding:3px 10px}
.chip.bad{color:var(--warn)}
.card .body{padding:0 16px 16px}
details.more{margin-top:8px}
details.more>summary{list-style:none;cursor:pointer;color:var(--mute);font-size:.85rem;min-height:36px;display:flex;align-items:center}
details.panel>summary{list-style:none;cursor:pointer;font-weight:700;font-size:1.05rem;min-height:36px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.panel>summary::-webkit-details-marker{display:none}
.chk{display:flex;gap:12px;align-items:center;min-height:44px;padding:4px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.prog{display:flex;gap:4px;margin:8px 0 12px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--home)}
.her{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.her h4{margin:12px 0 4px;font-size:.95rem}
.her h4:first-child{margin-top:0}
.her ul{margin:0;padding-left:20px}
.steps{padding-left:22px;margin:8px 0}
.steps li{margin-bottom:8px}
pre.msg{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;min-height:48px;border-radius:10px;cursor:pointer;white-space:nowrap;padding:0}
.tabs button[aria-current="page"]{color:var(--home)}
.tabs .addbtn{background:var(--ink);color:var(--bg);width:48px;min-height:48px;height:48px;border-radius:14px;margin:0 auto;font-size:1.9rem;font-weight:400;line-height:1;justify-content:center}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.toast button{border:1px solid var(--bg);background:none;color:var(--bg);border-radius:8px;padding:6px 10px;min-height:36px;font-weight:600}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{font-size:.9rem;padding:4px 6px}
.seg button{border:1px solid var(--line);background:none;border-radius:10px;min-height:44px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{border-top:1px solid var(--line);padding:12px 0}
.ev:first-of-type{border-top:0}
.evh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.evh b{font-size:1.02rem}
.evd{margin:6px 0 0;font-size:.95rem}
.evd.note{color:var(--mute);font-size:.88rem}
.grp{margin:16px 0 0;font-size:.9rem;color:var(--mute);font-weight:700}
.grp:first-of-type{margin-top:4px}
.sync{font-size:.85rem;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addMonths=(d,n)=>{const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),last))};
const days=s=>Math.round((parse(s)-today())/864e5);
const nice=s=>parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const longDate=d=>d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const sdate=n=>fmt(addDays(today(),n));
const plural=(n,w)=>n+" "+w+(n===1?"":"s");

function step(d,n,unit){return unit==="d"?addDays(d,n):unit==="w"?addDays(d,7*n):addMonths(d,n)}
function due(u){if(u.every>0&&u.last)return fmt(step(parse(u.last),+u.every,u.unit||"m"));return u.d||""}
function rel(ds){
  if(!ds)return{t:"No date yet",o:false};
  const n=days(ds);
  if(n<0)return{t:"Overdue by "+plural(-n,"day"),o:true};
  if(n===0)return{t:"Due today",o:false};
  if(n===1)return{t:"Due tomorrow",o:false};
  return{t:"In "+n+" days",o:false};
}
function mkItem(t,every,unit,d,st){return{id:uid(),t:t,every:every,unit:unit,last:"",d:d||"",h:"",n:"",st:!!st}}
function dateInfo(x){
  if(!x.d)return null;
  const p=x.d.split("-"),t=today();
  let o=new Date(t.getFullYear(),+p[1]-1,+p[2]);
  if(o<t)o=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);
  const n=Math.round((o-t)/864e5);
  return{o:fmt(o),n:n,plan:n<=(+x.w||0)*7};
}
function weekKey(d){const dow=(d.getDay()+6)%7;return fmt(addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-dow))}
function seasonNow(){
  const t=today(),m=t.getMonth();
  const name=m>=2&&m<=4?"spring":m>=5&&m<=7?"summer":m>=8&&m<=10?"fall":"winter";
  const y=m<2?t.getFullYear()-1:t.getFullYear();
  return{name:name,key:y+"-"+name};
}

function defDates(){return[{id:uid(),t:"Our anniversary",d:"",w:3},{id:uid(),t:"Wife's birthday",d:"",w:3},{id:uid(),t:"Daughter's birthday",d:"",w:3}]}
function fresh(){
  return{v:VERSION,at:0,dates:defDates(),log:[],checkins:[],updates:[],decisions:[],reviews:{},season:{},wins:"",focus:"",
   contacts:["Plumber","Electrician","Furnace / HVAC","Vet","Pediatrician","Dentist","Daughter's school office"].map(r=>({n:"",r:r,p:""})),
   facts:["Furnace filter size","Furnace model","Water shutoff location","Breaker panel location","Car oil type and filter","Pet food brand and meds","Daughter's clothing and shoe sizes"].map(k=>({k:k,v:""})),
   set:{day:6,cap:7,hideInstall:false},fun:{planned:{}},
   a:AREAS.map(a=>({scope:a.scope,done:a.done,plan:"",ideas:[],arch:[],up:a.up.map(u=>mkItem(u[0],u[1],u[2],sdate(u[3]),true))}))};
}
function migrate(s){
  if(!s||!Array.isArray(s.a)||s.a.length!==AREAS.length)return fresh();
  const f=fresh();
  ["dates","log","checkins","updates","decisions","contacts","facts"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=f[k]});
  ["reviews","season"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={}});
  s.wins=s.wins||"";s.focus=s.focus||"";
  if(!s.fun||typeof s.fun!=="object")s.fun={planned:{}};
  if(!s.fun.planned)s.fun.planned={};
  s.set=Object.assign({day:6,cap:7,hideInstall:false},s.set||{});
  s.dates.forEach(x=>{x.id=x.id||uid();x.w=x.w==null?3:x.w;x.d=x.d||""});
  s.a.forEach(d=>{
    d.ideas=d.ideas||[];d.arch=d.arch||[];d.up=d.up||[];d.plan=d.plan||"";
    d.up.concat(d.arch).forEach(u=>{u.id=u.id||uid();u.unit=u.unit||"m";u.h=u.h||"";u.n=u.n||"";u.last=u.last||"";u.d=u.d||"";u.every=+u.every||0});
  });
  if(!s.v||s.v<3){
    s.a[3].up=s.a[3].up.filter(u=>!(/^Birthday and anniversary/.test(u.t)&&!u.d&&!u.last));
    AREAS.forEach((a,i)=>a.up.forEach(def=>{
      const has=s.a[i].up.concat(s.a[i].arch).some(u=>u.t===def[0]);
      if(def[4]&&!has)s.a[i].up.push(mkItem(def[0],def[1],def[2],sdate(def[3]),true));
    }));
    s.a.forEach((d,i)=>d.up.forEach(u=>{
      if(due(u))return;
      const def=AREAS[i].up.find(x=>x[0]===u.t);
      if(def){u.d=sdate(def[3]);u.st=true}
    }));
    s.v=3;
  }
  return s;
}

/* ---------- derived data ---------- */
function dueItems(lo,hi){
  const out=[];
  S.a.forEach((d,i)=>d.up.forEach(u=>{const ds=due(u);if(!ds)return;const n=days(ds);if(n>=lo&&n<=hi)out.push({i:i,u:u,ds:ds,n:n})}));
  out.sort((a,b)=>a.n-b.n||a.i-b.i);
  return out;
}
function proStats(from,to){
  const L=S.log.filter(l=>l.on>=from&&(!to||l.on<=to));
  const p=L.filter(l=>l.pro!==false).length;
  return{total:L.length,pro:p,pct:L.length?Math.round(100*p/L.length):null};
}
function streak(){
  const set=new Set(S.checkins);
  let c=parse(weekKey(today()));
  if(!set.has(fmt(c)))c=addDays(c,-7);
  let n=0;
  while(set.has(fmt(c))){n++;c=addDays(c,-7)}
  return n;
}
function checkinDue(){return((today().getDay()+6)%7)>=S.set.day&&!S.checkins.includes(weekKey(today()))}
function reviewTarget(){

}

function updateData(){
  const t=today(),from=fmt(addDays(t,-6));
  const handled=S.log.filter(l=>l.on>=from).map(l=>l.t+" ("+l.a+")");
  (S.wins||"").split("\n").map(s=>s.trim()).filter(Boolean).forEach(w=>handled.push(w));
  const coming=dueItems(-99999,14).map(x=>({text:nice(x.ds)+": "+x.u.t+" ("+AREAS[x.i].name+")"+(x.n<0?", overdue, handling it":""),h:x.u.h}));
  const dates=S.dates.filter(x=>{const f=dateInfo(x);return f&&f.plan}).map(x=>x.t+" on "+nice(dateInfo(x).o));
  const decisions=S.decisions.filter(d=>!d.res&&d.q.trim()).map(d=>({q:d.q.trim(),rec:(d.rec||"").trim()}));
  const plans=[];S.a.forEach((d,i)=>{if(d.plan&&d.plan.trim())plans.push(AREAS[i].name+": "+d.plan.trim())});
  return{handled:handled,coming:coming,dates:dates,decisions:decisions,plans:plans,focus:(S.focus||"").trim()};
}
function buildUpdate(){
  const u=updateData(),L=["Weekly update, "+nice(fmt(today())),""];
  L.push("Handled this week:");
  if(u.handled.length)u.handled.forEach(x=>L.push("- "+x));else L.push("- Nothing logged yet");
  L.push("","Coming up in the next two weeks:");
  if(u.coming.length)u.coming.forEach(x=>L.push("- "+x.text+(x.h?". Heads-up: "+x.h:"")));else L.push("- Nothing dated yet");
  if(u.decisions.length){L.push("","Need your call:");u.decisions.forEach(d=>L.push("- "+d.q+(d.rec?" My pick: "+d.rec:"")))}
  if(u.dates.length){L.push("","Dates I'm planning for:");u.dates.forEach(x=>L.push("- "+x))}
  if(u.plans.length){L.push("","My plans:");u.plans.forEach(x=>L.push("- "+x))}
  if(u.focus)L.push("","Next week's focus:",u.focus);
  return L.join("\n");
}

    const dts=S.dates.map(x=>({x:x,i:dateInfo(x)})).filter(r=>r.i&&r.i.plan);

    <h3 style="margin-top:14px">My plans</h3>`+AREAS.map((a,i)=>`<label class="t">${esc(a.name)}</label><textarea data-f="plan" data-i="${i}">${esc(S.a[i].plan)}</textarea>`).join("");

/* ----- family fun ----- */
function findEv(id){return EVENTS.concat(IDEAS).find(e=>e.id===id)}
function evList(ev){if(ev.dates)return ev.dates.slice().sort();if(ev.s)return[ev.s,ev.e||ev.s];if(ev.e)return[ev.e];return[]}
function evEnd(ev){const l=evList(ev);return l[l.length-1]}
function evNext(ev){
  if(ev.any)return null;
  if(ev.dates)return ev.dates.slice().sort().find(d=>days(d)>=0)||null;
  const e=evEnd(ev);if(!e||days(e)<0)return null;
  return ev.s&&days(ev.s)>0?ev.s:fmt(today());
}
function evGroup(ev){
  const range=!ev.dates&&((ev.s&&ev.e&&ev.e!==ev.s)||(!ev.s&&ev.e));
  if(range&&(!ev.s||days(ev.s)<=0))return 0;
  const n=days(evNext(ev));
  return n<=7?1:n<=21?2:3;
}
function evDateText(ev){
  if(ev.any)return"Anytime";
  let t;
  const w=d=>parse(d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(ev.dt)t=ev.dt;
  else if(ev.dates)t=ev.dates.slice().sort().map(nice).join(", ");
  else if(ev.e&&ev.s&&ev.e!==ev.s)t=nice(ev.s)+" to "+nice(ev.e);
  else t=w(ev.s);
  return t+(ev.tm?", "+ev.tm:"");
}
function funList(when,where){
  return EVENTS.filter(ev=>{
    const nx=evNext(ev);if(!nx)return false;
    if(where&&where!=="all"&&ev.area!==where)return false;
    const g=evGroup(ev),n=days(nx);
    if(when==="week")return g<=1;
    if(when==="month")return g===0||n<=30;
    return true;
  }).sort((a,b)=>evGroup(a)-evGroup(b)||days(evNext(a))-days(evNext(b))||a.t.localeCompare(b.t));
}
function eventCard(ev){
  const pl=S.fun.planned[ev.id];
  return `<div class="ev"><div class="evh"><b>${esc(ev.t)}</b>${pl?`<span class="chip">Planned ${nice(pl)}</span>`:""}</div>
  <div class="due">${esc(evDateText(ev))}</div>
  <div class="due">${esc(ev.pl)}${ev.town?", "+esc(ev.town):""}</div>
  <p class="evd">${esc(ev.d)}</p>
  ${ev.cost?`<p class="evd"><b>Cost:</b> ${esc(ev.cost)}</p>`:""}
  ${ev.note?`<p class="evd note">${esc(ev.note)}</p>`:""}
  <div class="rowb"><button class="btn done sm" data-a="fplan" data-id="${ev.id}">${pl?"Change plan":"Plan it"}</button>${ev.u?`<a class="btn ghost sm" href="${esc(ev.u)}" target="_blank" rel="noopener noreferrer">Details</a>`:""}</div></div>`;
}
function funTodayPanel(){
  const l=funList("week").sort((a,b)=>(evGroup(a)===1?0:1)-(evGroup(b)===1?0:1)||days(evNext(a))-days(evNext(b))).slice(0,3);
  if(!l.length)return"";
  return `<section class="panel"><h3>Fun this week</h3>`+l.map(ev=>`<div class="r3" style="margin:8px 0"><span><b>${esc(ev.t)}</b><br><small class="sub">${esc(evDateText(ev))}, ${esc(ev.town||ev.pl)}</small></span><button class="btn ghost sm" data-a="fplan" data-id="${ev.id}">Plan it</button></div>`).join("")+`<button class="btn ghost sm" data-a="tab" data-t="fun">See all family fun</button></section>`;
}
function viewFun(){
  const age=-days(FUN_UPDATED),kind=FUNF.kind;
  const homeIdeas=IDEAS.filter(i=>i.k==="home"),outIdeas=IDEAS.filter(i=>i.k!=="home");
  let h=`<h1>Family fun</h1><p class="sub">${kind==="home"?"Things to do together without leaving the house.":"Southeastern Wisconsin. List updated "+nice(FUN_UPDATED)+". Times and dates change, so tap Details to confirm before you go."}</p>`;
  h+=`<div class="seg three" role="group" aria-label="Category" style="margin-bottom:12px">`+[["all","All"],["out","Out and about"],["home","At home"]].map(x=>`<button data-a="funkind" data-v="${x[0]}" aria-pressed="${kind===x[0]}">${x[1]}</button>`).join("")+`</div>`;
  if(kind==="home"){
    h+=`<section class="panel"><h3>At home</h3>${homeIdeas.map(eventCard).join("")}</section>`;
    return h;
  }
  if(age>35)h+=`<section class="panel alert"><h3>This list is getting old</h3><p class="sub">It was last updated ${age} days ago. Ask Claude to refresh it.</p></section>`;
  h+=`<section class="panel"><div class="r2"><label>When<select data-f="funwhen"><option value="week"${FUNF.when==="week"?" selected":""}>Next 7 days</option><option value="month"${FUNF.when==="month"?" selected":""}>Next 30 days</option><option value="all"${FUNF.when==="all"?" selected":""}>Everything</option></select></label>
  <label>Where<select data-f="funwhere"><option value="all">Anywhere</option>${FUN_AREAS.map(a=>`<option${FUNF.where===a?" selected":""}>${a}</option>`).join("")}</select></label></div></section>`;
  const list=funList(FUNF.when,FUNF.where);
  h+=`<section class="panel">`;
  if(!list.length)h+=`<p class="sub">Nothing matches. Try "Everything" or "Anywhere".</p>`;
  [1,0,2,3].forEach(gi=>{
    const items=list.filter(ev=>evGroup(ev)===gi);
    if(items.length)h+=`<h4 class="grp">${GROUPS[gi]}</h4>`+items.map(eventCard).join("");
  });
  h+=`</section>`;
  if(kind==="all")h+=`<details class="panel" data-o="ideas-home"${OPEN["ideas-home"]?" open":""}><summary>Ideas at home <span class="hint">${homeIdeas.length} ideas</span></summary>${homeIdeas.map(eventCard).join("")}</details>`;
  h+=`<details class="panel" data-o="ideas"${OPEN.ideas?" open":""}><summary>Anytime ideas out and about <span class="hint">no date needed</span></summary>${outIdeas.map(eventCard).join("")}</details>`;
  h+=`<section class="panel note"><h3>Keeping this list fresh</h3><p class="sub">It doesn't update by itself. Once a month, ask Claude: "Update the Fun tab for the next month." It re-checks local sources and gives you a new file to upload to GitHub.</p></section>`;
  return h;
}

/* plan sheet */
function planDefault(ev){
  if(ev.any){const t=today();return fmt(addDays(t,(6-t.getDay()+7)%7))}
  if(ev.dates)return evNext(ev);
  const s=evNext(ev),e=ev.e||ev.s;
  if(!e||s===e)return s;
  const d=addDays(parse(s),(6-parse(s).getDay()+7)%7);
  return fmt(d)<=e?fmt(d):s;
}
function drawPlan(){
  const el=$("#sheet"),ev=findEv(PL.id);
  const l=evList(ev),min=ev.any?fmt(today()):(fmt(today())>l[0]?fmt(today()):l[0]),max=ev.any?"":l[l.length-1];
  el.innerHTML=`<div role="dialog" aria-modal="true" aria-label="Plan it"><h3>${esc(ev.t)}</h3><p class="sub">${esc(evDateText(ev))}<br>${esc(ev.pl)}${ev.town?", "+esc(ev.town):""}</p>
  <label class="t" for="pl-d">Which day are you going?</label><input type="date" id="pl-d" value="${esc(PL.date)}" min="${esc(min)}"${max?` max="${esc(max)}"`:""}>
  <div class="rowb" style="flex-direction:column;align-items:stretch"><button class="btn" data-a="fladd">Add to my Today list</button><button class="btn ghost" data-a="flics">Calendar file (.ics)</button><button class="btn ghost" data-a="flg">Google Calendar</button><button class="btn ghost" data-a="flclose">Close</button></div>
  <p class="sub" id="plmsg" style="margin-top:10px"></p></div>`;
  el.hidden=false;
}
function plDate(){const i=$("#pl-d");return(i&&i.value)||PL.date}
function evDesc(ev){return[ev.d,evDateText(ev),ev.cost?"Cost: "+ev.cost:"",ev.u].filter(Boolean).join("\n")}
function evLoc(ev){return ev.pl+(ev.town?", "+ev.town+", WI":"")}
function buildEventICS(ev,date){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const nd=fmt(addDays(parse(date),1));
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//House Overview//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+ev.id+"-"+date+"@house-overview","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+date.replace(/-/g,""),"DTEND;VALUE=DATE:"+nd.replace(/-/g,""),"SUMMARY:"+icsEsc("Family fun: "+ev.t),"LOCATION:"+icsEsc(evLoc(ev)),"DESCRIPTION:"+icsEsc(evDesc(ev)),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ev.t),"TRIGGER:-PT15H","END:VALARM","END:VEVENT","END:VCALENDAR"];
  return L.map(fold).join("\r\n")+"\r\n";
}

/* ---------- feedback ---------- */
function toast(msg,actions){
  const el=$("#toast");
  el.innerHTML=`<span>${esc(msg)}</span>`+(actions||[]).map(a=>`<button data-a="${a[1]}">${esc(a[0])}</button>`).join("");
  el.hidden=false;clearTimeout(toastT);
  toastT=setTimeout(()=>{el.hidden=true},actions&&actions.length?8000:3200);
}
function armed(key,msg){
  const n=Date.now();
  if(ARMED[key]&&n-ARMED[key]<5000){delete ARMED[key];return true}
  ARMED[key]=n;toast(msg);return false;
}
async function copyText(text){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);return true}}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);const ok=document.execCommand("copy");ta.remove();return ok}catch(e){return false}
}
function shareText(text){
  if(navigator.share){
    return navigator.share({text:text}).catch(err=>{if(err&&err.name==="AbortError")return;return copyText(text).then(ok=>toast(ok?"Copied. Paste it into a message.":"Could not share or copy."))});
  }
  return copyText(text).then(ok=>toast(ok?"Copied. Paste it into a message.":"Could not copy."));
}
async function saveFile(name,mime,text){
  const ext=name.split(".").pop();
  try{
    if(window.claude&&window.claude.use&&["json","txt","csv","md"].indexOf(ext)>-1){
      const dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:text});return"saved"}
    }
  }catch(e){if(e&&e.code==="declined")return"declined"}
  try{
    const f=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return"shared"}
  }catch(e){if(e&&e.name==="AbortError")return"declined"}
  try{
    const b=new Blob([text],{type:mime}),url=URL.createObjectURL(b),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);return"download";
  }catch(e){return"failed"}
}

/* ---------- actions ---------- */
function doDone(i,id){
  const d=S.a[i],j=d.up.findIndex(u=>u.id===id);if(j<0)return;
  const u=d.up[j],before=JSON.parse(JSON.stringify(u)),rec=u.every>0;
  u.last=fmt(today());u.st=false;
  if(rec){u.d=""}else{d.up.splice(j,1);d.arch.unshift(Object.assign({},u,{doneOn:fmt(today())}))}
  S.log.unshift({id:uid(),t:u.t,a:AREAS[i].name,on:fmt(today()),pro:true});
  S.log=S.log.slice(0,MAXLOG);
  LAST={logId:S.log[0].id,i:i,j:j,before:before,rec:rec};
  persist();render();
  toast(rec?"Done. Next: "+nice(due(u)):"Done and archived",[["Undo","undo"],["She reminded me","remind"]]);
}
function undo(){
  if(!LAST)return;
  const L=LAST;LAST=null;
  S.log=S.log.filter(l=>l.id!==L.logId);
  const d=S.a[L.i];
  if(L.rec){const u=d.up.find(x=>x.id===L.before.id);if(u)Object.assign(u,L.before)}
  else{d.arch=d.arch.filter(x=>x.id!==L.before.id);d.up.splice(Math.min(L.j,d.up.length),0,L.before)}
  persist();render();toast("Undone");
}
function tryAdd(i,item,force){
  const d=S.a[i];
  if(!force&&d.up.length>=S.set.cap){
    PENDING={i:i,item:item};
    toast(AREAS[i].name+" already has "+d.up.length+" items (cap "+S.set.cap+"). Finish or archive one first.",[["Add anyway","addforce"]]);
    return false;
  }
  d.up.push(item);PENDING=null;persist();render();return true;
}
function toggleSeason(sk,si,on){
  const m=S.season[sk]||(S.season[sk]={}),idx=+si.slice(1);
  const text=(SEASONS[sk.split("-")[1]]||[])[idx]||"";
  if(on){S.log.unshift({id:uid(),t:text,a:"Home",on:fmt(today()),pro:true});S.log=S.log.slice(0,MAXLOG);m[si]=S.log[0].id}
  else{const lid=m[si];delete m[si];S.log=S.log.filter(l=>l.id!==lid)}
  persist();render();
}

/* calendar file */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
function fold(line){const out=[];let s=line;while(s.length>73){out.push(s.slice(0,73));s=" "+s.slice(73)}out.push(s);return out.join("\r\n")}
function buildICS(){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//House Overview//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:House Overview"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  let n=0;
  S.a.forEach((d,i)=>d.up.forEach(u=>{
    let ds=due(u);if(!ds)return;if(days(ds)<0)ds=fmt(today());
    L.push("BEGIN:VEVENT","UID:"+u.id+"@house-overview","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ds.replace(/-/g,""),"SUMMARY:"+icsEsc(AREAS[i].name+": "+u.t));
    if(u.every>0)L.push("RRULE:FREQ="+({d:"DAILY",w:"WEEKLY",m:"MONTHLY"}[u.unit||"m"])+";INTERVAL="+(+u.every));
    const desc=[u.h?"Heads-up: "+u.h:"",u.n].filter(Boolean).join("\n");
    if(desc)L.push("DESCRIPTION:"+icsEsc(desc));
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(u.t),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");n++;
  }));
  S.dates.forEach(x=>{
    if(!x.d)return;
    L.push("BEGIN:VEVENT","UID:"+x.id+"@house-overview","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+x.d.replace(/-/g,""),"SUMMARY:"+icsEsc(x.t),"RRULE:FREQ=YEARLY");
    if(x.w>0)L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("Start planning: "+x.t),"TRIGGER:-P"+(x.w*7)+"D","END:VALARM");
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(x.t),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");n++;
  });
  L.push("END:VCALENDAR");
  return{text:L.map(fold).join("\r\n")+"\r\n",n:n};
}

/* backup */
function backupText(){return JSON.stringify({app:"house-overview",saved:new Date().toISOString(),state:S},null,1)}
function restoreFrom(text){
  let o;try{o=JSON.parse(text)}catch(e){return"That does not look like a backup."}
  const st=o&&o.state?o.state:o;
  if(!st||!Array.isArray(st.a)||st.a.length!==AREAS.length)return"That backup does not match this app.";
  S=migrate(st);persist();render();return"";
}

function setField(t){

  if(id){u=S.a[i].up.find(x=>x.id===id);if(!u)return}
  switch(f){
  case"scope":case"done":case"plan":S.a[i][f]=v;break;
  case"ut":u.t=v;break;case"uh":u.h=v;break;case"un":u.n=v;break;
  case"last":u.last=v;u.st=false;break;
  case"d":u.d=v;u.st=false;break;
  case"every":u.every=Math.max(0,parseInt(v,10)||0);u.st=false;break;
  case"unit":u.unit=v;break;
  case"dtn":S.dates[k].t=v;break;
  case"dtd":S.dates[k].d=v;break;
  case"dtw":S.dates[k].w=Math.max(0,Math.min(26,parseInt(v,10)||0));break;
  case"ide":S.a[i].ideas[k].t=v;break;
  case"itag":S.a[i].ideas[k].tag=v;break;
  case"cn":S.contacts[k].n=v;break;case"cr":S.contacts[k].r=v;break;case"cp":S.contacts[k].p=v;break;
  case"fk":S.facts[k].k=v;break;case"fv":S.facts[k].v=v;break;
  case"dq":S.decisions[k].q=v;break;case"dr":S.decisions[k].rec=v;break;
  case"wins":S.wins=v;break;case"focus":S.focus=v;break;
  case"cit":if(CI)CI.text=v;return;
  case"funwhen":FUNF.when=v;return;
  case"funwhere":FUNF.where=v;return;
  case"rslip":revObj(t.dataset.m).slip=v;break;
  case"rchg":revObj(t.dataset.m).chg=v;break;
  case"sday":S.set.day=+v;break;
  case"scap":S.set.cap=Math.max(3,Math.min(20,parseInt(v,10)||7));break;
  default:return;
  }
  persist();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(e.target.id==="sheet"){closeSheet();return}
  const b=e.target.closest("[data-a]");
  if(b)act(b.dataset.a,b);
});
let RS=false;
document.addEventListener("input",function(e){
  const t=e.target;if(!t.dataset||!t.dataset.f||t.dataset.f==="season")return;
  if(RE.has(t.dataset.f)){if(t.type==="date"){setField(t);RS=true}return}
  setField(t);
});
document.addEventListener("focusout",function(){
  if(!RS)return;
  setTimeout(function(){
    const a=document.activeElement;
    if(a&&a.matches&&a.matches("input,textarea,select"))return;
    RS=false;render();
  },350);
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="bkin"){
    const f=t.files&&t.files[0];if(!f)return;
    const r=new FileReader();r.onload=function(){const m=restoreFrom(String(r.result));toast(m||"Backup restored")};r.readAsText(f);t.value="";return;
  }
  if(!t.dataset||!t.dataset.f)return;
  if(t.dataset.f==="season"){toggleSeason(t.dataset.sk,t.dataset.si,t.checked);return}
  if(RE.has(t.dataset.f)){
    setField(t);
    if(t.type==="date"){RS=true;if(t.dataset.f==="dtd")toast("Date saved");return}
    render();
  }
});
document.addEventListener("toggle",function(e){const d=e.target;if(d&&d.tagName==="DETAILS"&&d.dataset.o)OPEN[d.dataset.o]=d.open},true);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&(QA||PL)){closeSheet();return}
  if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;
  if(e.target.id==="qa-t"){const b=$('[data-a="qasave"]');if(b)b.click();return}
  const p=e.target.parentElement;
  if(p&&p.classList.contains("add")){const b=p.querySelector("button")||(p.previousElementSibling&&p.previousElementSibling.querySelector("button"));if(b)b.click()}
});

render();

/* ---------- optional sync inside Claude ---------- */
(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    const u=await window.claude.use("user"),db=await window.claude.use("db");
    if(!u||!db)return;
    const id=await u.id();if(!id)return;
    DB=db;UIDV=id;
    const snap=await db.collection("data/users/"+id).doc("state").get();
    let rem=null;
    if(snap&&snap.exists){try{rem=JSON.parse(snap.data().json)}catch(e){}}
    if(rem&&Array.isArray(rem.a)&&rem.a.length===AREAS.length&&(rem.at||0)>=(S.at||0)){
      const old=rem.v;S=migrate(rem);
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      setSync("Synced with your Claude account.");render();
      if(old!==VERSION)persist();
    }else{persist()}
  }catch(e){}
})();
})();
</script>
